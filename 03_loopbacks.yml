---
- name: Configure loopback 0 interfaces on CAT8000V
  hosts: catalyst
  gather_facts: false
  tasks:
   - name: configure loopback0 
     cisco.ios.ios_config:
      parents:
        - interface loopback0
      lines:
      - description configured_by_ansible
      - ip address 1.1.1.1 255.255.255.255
      - no shutdown
      - ip ospf 10 area 0
